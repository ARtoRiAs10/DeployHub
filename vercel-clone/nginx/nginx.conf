worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;

    # Deployment proxy: maps subdomain/path to S3 prefix
    server {
        listen 80;
        server_name *.deployhub.local deployhub.local;

        # Health check
        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Route /d/{deploymentId}/* → S3 bucket
        location ~ ^/d/([a-zA-Z0-9]+)(/.*)?$ {
            set $deployment_id $1;
            set $file_path $2;

            if ($file_path = "") {
                set $file_path "/index.html";
            }

            # Proxy to S3
            proxy_pass https://YOUR-BUCKET.s3.amazonaws.com/deployments/$deployment_id$file_path;
            proxy_set_header Host YOUR-BUCKET.s3.amazonaws.com;
            proxy_intercept_errors on;
            error_page 403 404 = @index_fallback;
        }

        # SPA fallback: try index.html
        location @index_fallback {
            # Rewrite to index.html for SPA routing
            rewrite ^ /index.html last;
        }
    }
}
