name: Nightly Regression

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every night
  workflow_dispatch:        # allow manual trigger

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Full matrix: test on all supported Node versions
  # ─────────────────────────────────────────────────────────────────────────
  full-matrix:
    name: Full Test Matrix (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: DeployHub/backend/package-lock.json

      - run: npm ci
        working-directory: DeployHub/backend

      - name: All tests with coverage
        working-directory: DeployHub/backend
        run: npm run test:ci
        env: { NODE_ENV: test }

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: DeployHub/backend/coverage/lcov.info
          flags: nightly-node${{ matrix.node }}
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────────────────────────────
  # Go main-package scanner: test against real public repos
  # ─────────────────────────────────────────────────────────────────────────
  go-scanner-live:
    name: Go Scanner — Live Repo Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: DeployHub/backend/package-lock.json

      - run: npm ci
        working-directory: DeployHub/backend

      - name: Test scanner against go_redis repo structure
        working-directory: DeployHub/backend
        run: |
          node -e "
          const { detectFromCuratedList } = require('./src/services/detector/curated');
          const fs = require('fs-extra'), path = require('path'), os = require('os');

          async function run() {
            const dir = await fs.mkdtemp(path.join(os.tmpdir(), 'go-redis-'));
            try {
              await fs.writeFile(path.join(dir, 'go.mod'), 'module github.com/ARtorias742/Redis\n\ngo 1.22\n\nrequire (\n\tgithub.com/sirupsen/logrus v1.9.3\n\tgopkg.in/yaml.v3 v3.0.1\n)\n');
              await fs.ensureDir(path.join(dir, 'cmd'));
              await fs.writeFile(path.join(dir, 'cmd/main.go'), 'package main\n\nimport \"flag\"\n\nfunc main() { flag.Parse() }\n');
              await fs.ensureDir(path.join(dir, 'internal/server'));
              await fs.writeFile(path.join(dir, 'internal/server/server.go'), 'package server\n');
              await fs.ensureDir(path.join(dir, 'internal/store'));
              await fs.writeFile(path.join(dir, 'internal/store/store.go'), 'package store\n');

              const r = await detectFromCuratedList(dir);
              console.log('Detected:', JSON.stringify(r, null, 2));

              if (r.framework !== 'go')            throw new Error('Expected go, got ' + r.framework);
              if (r.isBackend !== true)            throw new Error('Expected isBackend=true');
              if (r.goMainPkg !== 'cmd')           throw new Error('Expected goMainPkg=cmd, got ' + r.goMainPkg);
              if (r.buildCommand.includes('./...')) throw new Error('buildCommand must not use ./...');
              if (!r.buildCommand.includes('./cmd')) throw new Error('buildCommand must target ./cmd');
              console.log('All assertions passed for go_redis structure');
            } finally { await fs.remove(dir); }
          }
          run().catch(e => { console.error(e); process.exit(1); });
          "

  # ─────────────────────────────────────────────────────────────────────────
  # Notify on failure
  # ─────────────────────────────────────────────────────────────────────────
  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [full-matrix, go-scanner-live]
    if: failure()
    steps:
      - name: Post failure summary
        run: |
          echo "::error::Nightly regression failed. Jobs: full-matrix=${{ needs.full-matrix.result }}, go-scanner-live=${{ needs.go-scanner-live.result }}"