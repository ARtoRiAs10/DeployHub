events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log  warn;

  # ── Performance ────────────────────────────────────────────────────────────
  sendfile        on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # ── Core upstreams (Docker Compose service names) ─────────────────────────
  upstream backend  { server backend:4000; }
  upstream frontend { server frontend:3000; }

  # ── Main server ────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # -- DeployHub API (backend Express server) --------------------------------
    location /api/ {
      proxy_pass         http://backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # -- Health check (backend) -----------------------------------------------
    location /health {
      proxy_pass       http://backend;
      proxy_set_header Host $host;
    }

    # -- Frontend (Next.js) ---------------------------------------------------
    location / {
      proxy_pass         http://frontend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
    }
  }

  # ── Dynamically-generated backend project routes ──────────────────────────
  # Each deployed backend project gets its own server block written by
  # nginxConfigService.js (called from deploymentWorker after EC2 deploy).
  # Files are written to /etc/nginx/conf.d/projects/ and included below.
  #
  # Pattern:  http://<EC2_PUBLIC_DNS>:<HOST_PORT>
  # Each file: /etc/nginx/conf.d/projects/project-<projectId>.conf
  #
  # The backend triggers `nginx -s reload` via SSM after writing configs.
  include /etc/nginx/conf.d/projects/*.conf;
}
